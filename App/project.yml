name: SSHMon
options:
  bundleIdPrefix: com.mick
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  MonitorCore:
    path: ../Core
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SSHMon
targets:
  SSHMon-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MonitorCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mick.sshmon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "连接你局域网里的服务器（SSH）"
  SSHMon-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: MonitorCore
      - package: SwiftTerm
    entitlements:
      path: SSHMon-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mick.sshmon
